name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev,plot]"
      - run: python -m pytest
      - run: python -m leo_maneuver_analysis --config examples/maneuver_impact.json --output runs/ci --plot
